plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tiscan.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.tiscan.app"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "5.0.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'

    // CameraX — powers PreviewView
    implementation 'androidx.camera:camera-core:1.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.0'
    implementation 'androidx.camera:camera-lifecycle:1.4.0'
    implementation 'androidx.camera:camera-view:1.4.0'

    // ARCore — AR measurement + WALK mode plane tracking
    implementation 'com.google.ar:core:1.47.0'

    // ML Kit — on-device room image labeling (offline model, no network call at runtime)
    implementation 'com.google.mlkit:image-labeling:17.0.9'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
